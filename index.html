<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>물풍선 대작전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --ink: #3b3355; --muted: #8b84a3; --paper: #fff; --bg: #dff4ff; --line: #ece4d3;
    --yellow: #ffd84d; --yellow-soft: #fff4c2; --pink: #ff9ec4; --mint: #8fe3c8; --mint-soft: #ddf8ee;
    --sky: #9cc9ff; --sky-soft: #e3f0ff; --lav-soft: #efe9ff; --accent: #7b61ff; --bad: #ff5c7a; --good: #22b573;
    --red: #ff5c5c; --blue: #3d8bff;
    --pop: 4px 4px 0 var(--ink);
    --display: "Jua", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { color: var(--ink); background-color: var(--bg); background-image: radial-gradient(#bfe6ff 1.6px, transparent 1.8px); background-size: 24px 24px;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; }
  .hidden { display: none !important; }
  button { font: inherit; color: var(--ink); cursor: pointer; background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; padding: 8px 16px;
    box-shadow: 3px 3px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
  button:hover:not(:disabled) { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
  button:active:not(:disabled) { transform: translate(3px,3px); box-shadow: 0 0 0 var(--ink); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--yellow); font-family: var(--display); font-size: 19px; }
  input, select { font: inherit; color: var(--ink); padding: 10px 14px; border: 3px solid var(--ink); border-radius: 14px; background: #fff; outline: none; }
  input { -webkit-user-select: text; user-select: text; }
  .card { background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; box-shadow: var(--pop); }
  .banner { background: var(--yellow-soft); border-bottom: 3px solid var(--ink); padding: 6px 16px; font-size: 13px; text-align: center; }

  #join { max-width: 440px; margin: 48px auto; padding: 30px; text-align: center; }
  #join h1 { font-size: 44px; margin: 6px 0; }
  #join .sub { color: var(--muted); margin: 8px 0 18px; font-size: 15px; }
  #join .sub.err { color: var(--bad); font-weight: 700; }
  #join label { display: block; text-align: left; font-family: var(--display); font-size: 17px; margin: 14px 0 6px; }
  #join input { width: 100%; }
  #join .row { display: flex; gap: 12px; margin-top: 22px; }
  #join .row > * { flex: 1; padding: 12px; font-family: var(--display); font-size: 20px; }

  #game { max-width: 1180px; margin: 0 auto; padding: 14px; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; flex-wrap: wrap; }
  .roomchip { font-family: var(--display); font-size: 19px; background: var(--lav-soft); border: 3px solid var(--ink); padding: 3px 14px; border-radius: 999px; }
  .copy { font-size: 13px; padding: 5px 12px; box-shadow: 2px 2px 0 var(--ink); }
  .grow { flex: 1; }
  .info { font-family: var(--display); font-size: 20px; }
  .info b { font-weight: 400; background: var(--yellow); border: 2px solid var(--ink); border-radius: 999px; padding: 0 12px; }
  .layout { display: grid; grid-template-columns: 250px 1fr; gap: 14px; margin-top: 14px; align-items: start; }
  .panel-title { font-family: var(--display); font-size: 19px; padding: 12px 14px 6px; }
  #plist { list-style: none; margin: 0; padding: 4px 10px 12px; }
  #plist li { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 14px; margin-bottom: 7px; background: #f4f9ff; border: 2px solid transparent; }
  #plist li.me { border-color: var(--ink); }
  #plist li.dead { opacity: .4; }
  #plist li.trap { background: var(--sky-soft); }
  .av { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 21px; flex: none; border: 3px solid var(--ink); }
  .pinfo { flex: 1; min-width: 0; }
  .pname { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pst { font-size: 12px; color: var(--muted); }
  .wins { font-family: var(--display); font-size: 20px; }
  .tm { display: inline-block; font-size: 11px; font-weight: 800; color: #fff; border-radius: 999px; padding: 0 7px; margin-right: 4px; }
  .tm0 { background: var(--red); } .tm1 { background: var(--blue); }

  .stagecard { padding: 12px; }
  .stage { position: relative; width: 100%; max-width: 720px; margin: 0 auto; }
  canvas#cv { display: block; width: 100%; background: #dff1c6; border-radius: 14px; border: 3px solid var(--ink); touch-action: none; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 14px;
    background: rgba(255,255,255,.55); border-radius: 14px; pointer-events: none; }
  .overlay.solid { background: rgba(255,253,247,.94); pointer-events: auto; }
  .overlay h2 { font-size: 34px; text-shadow: 0 2px 0 #fff; }
  .big { font-family: var(--display); font-size: 90px; line-height: 1; color: var(--accent); -webkit-text-stroke: 2px var(--ink); }
  .hud { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  .st { display: flex; align-items: center; gap: 8px; background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 6px 12px 6px 8px; box-shadow: 3px 3px 0 var(--ink); }
  .st img { width: 36px; height: 36px; flex: none; }
  .st b { display: block; font-family: var(--display); font-weight: 400; font-size: 14px; line-height: 1; color: var(--muted); }
  .st .pips { display: flex; gap: 3px; margin-top: 5px; }
  .st .pips i { width: 10px; height: 10px; border-radius: 50%; background: #eef1f7; border: 2px solid #d3d9e8; }
  .st .pips i.on { background: var(--c); border-color: var(--ink); }
  .st .pips i.use { background: #cfe0fa; border-color: #8ba6d6; }
  .st .num { font-family: var(--display); font-size: 24px; min-width: 26px; text-align: right; }
  .mi { width: 16px; height: 16px; vertical-align: -3px; margin: 0 1px 0 4px; }
  .mi:first-child { margin-left: 0; }
  .help { text-align: center; color: var(--muted); font-size: 13px; margin-top: 8px; line-height: 1.6; }
  .help kbd { background: #fff; border: 2px solid var(--ink); border-radius: 6px; padding: 0 6px; font-size: 12px; }

  .lobby { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 14px 8px; text-align: center; }
  .lobby h2 { font-size: 32px; }
  .lobby .sub { color: var(--muted); margin: -6px 0 0; font-size: 14px; }
  .lrow { display: flex; align-items: center; gap: 10px; background: #f4f9ff; border: 3px solid var(--ink); border-radius: 16px; padding: 6px 12px; width: min(100%, 420px); }
  .lrow .nm { flex: 1; text-align: left; font-weight: 800; }
  .tbtn { padding: 3px 12px; font-size: 14px; box-shadow: 2px 2px 0 var(--ink); color: #fff; }
  .tbtn.t0 { background: var(--red); } .tbtn.t1 { background: var(--blue); }
  .setbox { width: 100%; max-width: 520px; background: #f4fbff; border: 3px solid var(--ink); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .setrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; font-weight: 700; }
  .setrow .lbl { font-family: var(--display); font-size: 17px; font-weight: 400; }
  .pill { display: inline-block; background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 2px 12px; font-weight: 800; }
  #startBtn { font-size: 22px; padding: 12px 40px; }
  .leftcol { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .chatbox { display: flex; flex-direction: column; height: 300px; overflow: hidden; }
  #log { flex: 1; overflow-y: auto; padding: 2px 10px 8px; font-size: 13px; -webkit-user-select: text; user-select: text; }
  #log .m { margin: 5px 0; line-height: 1.4; word-break: break-all; background: #f1f6ff; border-radius: 12px 12px 12px 4px; padding: 5px 9px; width: fit-content; max-width: 100%; }
  #log .m .n { font-weight: 800; margin-right: 6px; }
  #log .sys { color: var(--muted); font-size: 12px; text-align: center; margin: 6px 0; }
  .chatform { display: flex; gap: 6px; padding: 8px; border-top: 3px solid var(--ink); background: #f4fbff; }
  .chatform input { flex: 1; min-width: 0; padding: 7px 10px; }
  .chatform button { padding: 6px 12px; }
  .av { overflow: hidden; background: #fff; }
  .av img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .ci { width: 20px; height: 20px; vertical-align: -5px; margin-right: 2px; }
  .pickwrap { width: 100%; max-width: 580px; }
  .lbl2 { font-family: var(--display); font-size: 18px; margin-bottom: 8px; }
  .pickgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .pk { padding: 4px 2px 6px; border-radius: 14px; box-shadow: 2px 2px 0 var(--ink); display: flex; flex-direction: column; align-items: center; font-size: 12px; font-weight: 800; background: #fff; }
  .pk img { width: 56px; height: 56px; }
  .pk.on { background: var(--yellow); }
  .pk:disabled { opacity: .35; }
  .togglebtn { font-size: 14px; padding: 6px 14px; background: var(--sky-soft); }
  .lobbyspec { font-size: 14px; color: var(--muted); }
  .watchbtn { width: 100%; margin-top: 12px; font-size: 15px; background: var(--sky-soft); }
  .spectag { font-size: 11px; background: var(--sky-soft); border: 1px solid var(--ink); border-radius: 999px; padding: 0 6px; margin-right: 4px; }
  @media (max-width: 560px) { .pickgrid { grid-template-columns: repeat(4, 1fr); } }
  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 18px; border-radius: 999px; font-size: 14px; z-index: 40; max-width: 92vw; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.on { opacity: 1; }

  #touch { display: none; position: fixed; left: 0; right: 0; bottom: 0; height: 190px; z-index: 30; pointer-events: none; }
  #touch .dp { position: absolute; left: 14px; bottom: 14px; width: 150px; height: 150px; pointer-events: auto; }
  #touch .dp button, #touch .act button { position: absolute; width: 50px; height: 50px; padding: 0; font-size: 20px; opacity: .85; border-radius: 14px; }
  #touch .act { position: absolute; right: 14px; bottom: 14px; width: 150px; height: 150px; pointer-events: auto; }
  @media (pointer: coarse) { #touch.on { display: block; } body { padding-bottom: 200px; } }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  /* 컴퓨터 화면: 게임 중엔 판 크기를 화면 높이에 맞추고 스크롤을 잠가서 방향키로 화면이 움직이지 않게 */
  @media (min-width: 901px) and (not (pointer: coarse)) {
    body.inplay { overflow: hidden; height: 100vh; }
    body.inplay .stage { max-width: min(720px, max(320px, calc((100vh - 290px) * 1.1538))); }
    body.inplay .chatbox { height: 240px; }
  }
</style>
</head>
<body>
<div id="modeBanner" class="banner hidden"></div>
<div id="toast"></div>

<section id="join" class="card">
  <div style="font-size:46px">🎈</div>
  <h1>물풍선 대작전</h1>
  <p class="sub">물풍선으로 상대를 가두고, 블록을 부수고, 아이템으로 강해져요!<br>최대 8명 · 개인전 / 팀전</p>
  <label for="nameInput">닉네임</label>
  <input id="nameInput" maxlength="10" placeholder="예: 세훈">
  <label for="roomInput">방 번호 (영어·숫자 2~12자)</label>
  <input id="roomInput" maxlength="12" placeholder="예: 1234, ROOM7">
  <div class="row">
    <button id="createBtn" class="primary">방 만들기</button>
    <button id="enterBtn">입장하기</button>
  </div>
  <button id="watchBtn" class="watchbtn">👀 보기만 할래요 (관전으로 입장)</button>
</section>

<section id="game" class="hidden">
  <div class="topbar card">
    <span class="roomchip">방 <span id="roomCode"></span></span>
    <button id="copyBtn" class="copy">🔗 초대 링크 복사</button>
    <span class="grow"></span>
    <span id="roundInfo" class="info"></span>
    <span id="timeInfo" class="info"></span>
  </div>
  <div class="layout">
    <div class="leftcol">
      <div class="card">
        <div class="panel-title">🏆 참가자</div>
        <ul id="plist"></ul>
      </div>
      <div class="card chatbox">
        <div class="panel-title">💬 채팅 <span style="font-size:12px;color:var(--muted);font-family:sans-serif">(Enter 누르면 입력)</span></div>
        <div id="log"></div>
        <form id="chatForm" class="chatform">
          <input id="chatInput" maxlength="60" autocomplete="off" placeholder="메시지 입력">
          <button class="primary" style="font-size:16px">전송</button>
        </form>
      </div>
    </div>
    <div class="card stagecard">
      <div id="lobbyPanel" class="lobby hidden"></div>
      <div id="stageWrap" class="hidden">
        <div class="stage">
          <canvas id="cv"></canvas>
          <div id="overlay" class="overlay hidden"></div>
        </div>
        <div id="hud" class="hud"></div>
        <div class="help">이동 <kbd>←↑↓→</kbd> 또는 <kbd>W A S D</kbd> · 물풍선 <kbd>Space</kbd> · 바늘(갇혔을 때 탈출) <kbd>Shift</kbd><br>갇힌 사람을 <b>적이 건드리면 터져요</b> · <b>팀전에선 팀원이 건드리면 구해줘요</b></div>
      </div>
    </div>
  </div>
</section>

<div id="touch">
  <div class="dp">
    <button data-d="1" style="left:50px;top:0">▲</button>
    <button data-d="2" style="left:50px;top:100px">▼</button>
    <button data-d="3" style="left:0;top:50px">◀</button>
    <button data-d="4" style="left:100px;top:50px">▶</button>
  </div>
  <div class="act">
    <button id="tBomb" style="right:0;top:50px;width:84px;height:84px;font-size:34px;border-radius:50%">🎈</button>
    <button id="tNeedle" style="right:90px;top:0">📌</button>
  </div>
</div>

<script>
// ===================== 설정 =====================
const SUPABASE_URL = "https://ejwoofgujgnmeixwispl.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqd29vZmd1amdubWVpeHdpc3BsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwNDQ0NzUsImV4cCI6MjEwOTYyMDQ3NX0.P49zFX3Dk6rB0-bGJex94khJER4g517lXAhqruUbTk8";
const SNAP_MS = 100;      // 방장이 화면 정보를 보내는 간격 (줄이면 부드럽지만 메시지가 늘어요)
const TICK_MS = 30;       // 방장 게임 계산 간격
const COUNTDOWN_MS = 3000, ROUNDEND_MS = 3500;
const $ = (id) => document.getElementById(id);

//#SIM-START
// ===================== 게임 규칙 (방장 컴퓨터에서만 계산) =====================
const COLS = 15, ROWS = 13;
const FFA_SPAWNS = [[0,0],[14,12],[14,0],[0,12],[7,0],[7,12],[0,6],[14,6]];
const TEAM_SPAWNS = [[[0,0],[0,12],[0,6],[7,0]], [[14,12],[14,0],[14,6],[7,12]]];
const FUSE = 2.4, FLAME_T = 0.55, TRAP_T = 4.5, HALF = 0.4, TIME_LIMIT = 150;
const MAXV = { b: 7, r: 8, s: 5, n: 3 };
const ITEM_KEYS = "brsn";                       // b 풍선+  r 물줄기+  s 신발  n 바늘
const shufDirs = () => DIRS.slice().sort(() => Math.random() - 0.5);   // 봇 길찾기 방향 순서를 매번 섞음 (한쪽 자리가 유리해지는 것 방지)
const DIRS = [[0,-1],[0,1],[-1,0],[1,0]];       // 방향 코드 1=위 2=아래 3=왼 4=오른

// ---------- 맵 6종: 블록 배치(레이아웃) ----------
const KS = (list) => new Set(list.map(([c, r]) => r * COLS + c));
const SNOW_W = KS([[3,3],[7,3],[11,3],[3,9],[7,9],[11,9],[3,6],[11,6],[6,6],[7,6],[8,6],[7,5],[7,7]]);
const CANDY_W = KS([[2,2],[12,2],[2,10],[12,10],[7,6],[5,4],[9,4],[5,8],[9,8]]);
const MAPS = [
  { n: "숲 놀이터", icon: "🌳", soft: 0.72, hard: (c, r) => c % 2 === 1 && r % 2 === 1 },
  { n: "눈 마을", icon: "❄️", soft: 0.68, hard: (c, r) => SNOW_W.has(r * COLS + c) },
  { n: "사막 복도", icon: "🏜️", soft: 0.6, hard: (c, r) => ((r === 3 || r === 9) && c >= 2 && c <= 12 && c !== 7) || (r === 6 && c >= 4 && c <= 10 && c % 2 === 0) },
  { n: "사탕 나라", icon: "🍬", soft: 0.8, hard: (c, r) => CANDY_W.has(r * COLS + c) },
  { n: "해변", icon: "🏖️", soft: 0.6, hard: (c, r) => ((r === 4 || r === 8) && ((c >= 2 && c <= 5) || (c >= 9 && c <= 12))) || (r === 6 && c >= 6 && c <= 8) },
  { n: "밤의 광장", icon: "🌙", soft: 0.7, hard: (c, r) => ((r === 3 || r === 9) && c >= 4 && c <= 10 && c !== 7) || ((c === 4 || c === 10) && r >= 3 && r <= 9 && r !== 6) || ((c === 2 || c === 12) && (r === 2 || r === 10)) },
];
// 시작 자리 주변은 비워 두고, 모든 시작 자리가 서로 이어지는지 확인 (안 이어지면 기본 맵으로)
function buildHard(mapIdx, spawns) {
  const reserved = new Set();
  spawns.forEach(([sc, sr]) => { for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) if (Math.abs(c - sc) + Math.abs(r - sr) <= 2) reserved.add(r * COLS + c); });
  for (const idx of [mapIdx, 0]) {
    const hard = new Uint8Array(COLS * ROWS);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (MAPS[idx].hard(c, r) && !reserved.has(r * COLS + c)) hard[r * COLS + c] = 1;
    const seen = new Uint8Array(COLS * ROWS), st = [spawns[0][1] * COLS + spawns[0][0]]; seen[st[0]] = 1;
    while (st.length) { const k = st.pop(), c = k % COLS, r = (k / COLS) | 0;
      for (const [dx, dy] of DIRS) { const nc = c + dx, nr = r + dy; if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS) continue; const nk = nr * COLS + nc; if (!seen[nk] && !hard[nk]) { seen[nk] = 1; st.push(nk); } } }
    if (spawns.every(([sc, sr]) => seen[sr * COLS + sc])) { for (let k = 0; k < hard.length; k++) if (!hard[k] && !seen[k]) hard[k] = 1; return { hard, reserved, idx }; }   // 갇힌 빈칸은 벽으로 메움
  }
}
function makeGame(order, mode, mapIdx) {   // order: [{id, team, bot}]
  const grid = new Uint8Array(COLS * ROWS), hidden = new Array(COLS * ROWS).fill("");
  const spawns = [], cnt = [0, 0];
  order.forEach((o, i) => spawns.push(mode === "team" ? TEAM_SPAWNS[o.team][cnt[o.team]++ % 4] : FFA_SPAWNS[i % 8]));
  const { hard, reserved, idx } = buildHard(mapIdx || 0, spawns);
  for (let k = 0; k < grid.length; k++) {
    if (hard[k]) grid[k] = 1;
    else if (!reserved.has(k) && Math.random() < MAPS[idx].soft) {
      grid[k] = 2;
      if (Math.random() < 0.4) { const x = Math.random(); hidden[k] = x < 0.32 ? "b" : x < 0.64 ? "r" : x < 0.88 ? "s" : "n"; }
    }
  }
  const players = order.map((o, i) => ({ id: o.id, team: o.team, bot: o.bot ? { t: Math.random() * 0.3, target: null } : null,

  const mi = order.indexOf(myId), me = v && mi >= 0 ? v.players[mi] : null;
  const card = (k, label, col, n, max, num, used) => `<div class="st"><img src="${ICON_URL[k]}"><div><b>${label}</b>${pips(n, max, col, used)}</div><span class="num">${num}</span></div>`;
  setHTML($("hud"), me ? card("b", "물풍선", "#3d9bff", me.bm, 7, `${me.bm - me.out}/${me.bm}`, me.out) + card("r", "물줄기", "#17a6e0", me.rg, 8, me.rg) + card("s", "속도", "#ff6b8a", me.sp, 5, me.sp) + card("n", "바늘", "#ff5c7a", me.nd, 3, me.nd) : `<div class="st"><b style="font-size:18px;color:var(--ink)">👀 관전 중</b></div>`);
  if (v) $("timeInfo").innerHTML = S.phase === "playing" ? `⏱️ <b>${Math.floor(v.tl / 60)}:${String(v.tl % 60).padStart(2, "0")}</b>` : "";
}
function render() {
  if (!net) return;
  const ov = $("overlay"), lp = $("lobbyPanel"), sw = $("stageWrap");
  if (!S) { lp.classList.remove("hidden"); sw.classList.add("hidden"); setHTML(lp, "<h2>⏳ 연결 중...</h2>"); return; }
  const hostId = hostOrder()[0], humans = playerIds(), specs = specIds();
  const lobbyLike = S.phase === "lobby";
  lp.classList.toggle("hidden", !lobbyLike); sw.classList.toggle("hidden", lobbyLike);
  $("touch").classList.toggle("on", (S.phase === "playing" || S.phase === "countdown") && (S.order || []).includes(myId));
  const inplay = ["countdown", "playing", "roundEnd"].includes(S.phase);
  if (inplay && !document.body.classList.contains("inplay")) scrollTo(0, 0);
  document.body.classList.toggle("inplay", inplay);
  $("roundInfo").innerHTML = lobbyLike ? "🎈 대기실" : `라운드 <b>${S.round}</b> · ${S.winsTo}승 먼저 · ${MAPS[Math.max(0, S.curMap)].icon} ${MAPS[Math.max(0, S.curMap)].n}`;
  if (lobbyLike) {
    $("timeInfo").innerHTML = "";
    const rows = humans.map((id) => {
      const t = S.teamOf[id] === 1 ? 1 : 0;
      const btn = S.mode === "team" ? (id === myId ? `<button class="tbtn t${t}" data-team="1">${TEAM_NAME[t]} ↔</button>` : `<span class="tm tm${t}">${t ? "파랑" : "빨강"}</span>`) : "";
      return `<div class="lrow">${avHTML(id)}<span class="nm">${esc(present[id].name)}${id === hostId ? " 👑" : ""}${id === myId ? " (나)" : ""}</span>${btn}</div>`;
    }).join("");
    const specLine = specs.length ? `<p class="lobbyspec">👀 관전 ${specs.length}명: ${specs.map((id) => esc(present[id].name) + (id === hostId ? " 👑" : "") + (id === myId ? " (나)" : "")).join(", ")}</p>` : "";
    const nb = Math.min(S.bots, Math.max(0, 8 - humans.length)), total = humans.length + nb;
    const sel = (id, opts, cur) => `<select id="${id}">${opts.map(([v, l]) => `<option value="${v}" ${String(v) === String(cur) ? "selected" : ""}>${l}</option>`).join("")}</select>`;
    const mapOpts = [["rand", "🎲 랜덤"]].concat(MAPS.map((m, i) => [i, `${m.icon} ${m.n}`]));
    const mapName = S.map === "rand" ? "🎲 랜덤" : `${MAPS[S.map].icon} ${MAPS[S.map].n}`;
    const settings = isHost
      ? `<div class="setrow"><span class="lbl">🎮 모드</span>${sel("setMode", [["ffa", "개인전"], ["team", "팀전 (빨강 vs 파랑)"]], S.mode)}<span class="lbl">🏁 승리</span>${sel("setWins", [[1, "1승"], [2, "2승 먼저"], [3, "3승 먼저"]], S.winsTo)}<span class="lbl">🤖 봇</span>${sel("setBots", Array.from({ length: 8 }, (_, i) => [i, i + "명"]), S.bots)}<span class="lbl">🗺️ 맵</span>${sel("setMap", mapOpts, S.map)}</div>`
      : `<div class="setrow"><span class="lbl">🎮 모드</span><span class="pill">${S.mode === "team" ? "팀전" : "개인전"}</span><span class="lbl">🏁 승리</span><span class="pill">${S.winsTo}승 먼저</span><span class="lbl">🤖 봇</span><span class="pill">${S.bots}명</span><span class="lbl">🗺️ 맵</span><span class="pill">${mapName}</span></div>`;
    const myK = charK(myId), takenSet = new Set(humans.filter((id) => id !== myId).map((id) => charK(id)));
    const picker = mySpec ? `<p class="sub">👀 관전 중이에요. 채팅은 할 수 있어요!</p>`
      : `<div class="pickwrap"><div class="lbl2">🎭 내 캐릭터 고르기</div><div class="pickgrid">${CHARS.map((H, k) => `<button class="pk ${k === myK ? "on" : ""}" data-pick="${k}" ${takenSet.has(k) ? "disabled" : ""}><img src="${charURL(k)}">${H.n}</button>`).join("")}</div></div>`;
    if (setHTML(lp, `<h2>🎈 대기실</h2><p class="sub">참가 ${total}명 (최대 8명) · ${isHost ? "방장이 시작하면 게임이 시작돼요" : "방장(👑)이 시작하길 기다리는 중..."}</p>${rows}${specLine}${picker}<button id="specBtn" class="togglebtn">${mySpec ? "🎮 참가하기" : "👀 관전하기"}</button><div class="setbox">${settings}</div>${isHost ? `<button id="startBtn" class="primary" ${total < 2 ? "disabled" : ""}>게임 시작! 🚀</button><p class="sub">⚠️ 방장은 게임 중 이 탭을 계속 켜두세요 (게임 계산을 맡아요)</p>` : ""}${S.final ? `<p class="sub">지난 판 결과: ${esc(S.final)}</p>` : ""}`)) {
      if (isHost) {
        $("setMode").onchange = () => emit({ t: "settings", mode: $("setMode").value });
        $("setWins").onchange = () => emit({ t: "settings", winsTo: +$("setWins").value });
        $("setBots").onchange = () => emit({ t: "settings", bots: +$("setBots").value });
        $("setMap").onchange = () => { const v = $("setMap").value; emit({ t: "settings", map: v === "rand" ? "rand" : +v }); };
        $("startBtn").onclick = () => emit({ t: "start" });
      }
      $("specBtn").onclick = () => setSpectator(!mySpec);
      lp.querySelectorAll("[data-pick]").forEach((b) => (b.onclick = () => emit({ t: "pick", from: myId, ch: +b.dataset.pick })));
      lp.querySelectorAll("[data-team]").forEach((b) => (b.onclick = () => emit({ t: "team", from: myId, team: S.teamOf[myId] === 1 ? 0 : 1 })));
    }
    ov.classList.add("hidden"); updateSide(null); return;
  }
  // 게임 화면 오버레이
  ov.classList.remove("hidden"); ov.classList.remove("solid");
  if (S.phase === "countdown") { setHTML(ov, `<div class="big" id="cdNum">3</div><h2>준비하세요!</h2>`); }
  else if (S.phase === "playing") { const mi = S.order.indexOf(myId); ov.classList.add("hidden");
    if (mi < 0) { ov.classList.remove("hidden"); setHTML(ov, `<h2 style="font-size:20px;margin-top:auto">👀 이번 판은 관전 중이에요</h2>`); ov.style.background = "transparent"; } }
  else if (S.phase === "roundEnd") { setHTML(ov, `<h2>${esc(S.msg)}</h2>`); }
  else if (S.phase === "gameOver") {
    ov.classList.add("solid"); ov.style.background = "";
    setHTML(ov, `<div style="font-size:50px">🏆</div><h2>${esc(S.final)}</h2><div class="setbox">${S.mode === "team" ? `<div class="pill">${TEAM_NAME[0]} ${S.twins[0]} : ${S.twins[1]} ${TEAM_NAME[1]}</div>` : S.order.slice().sort((a, b) => (S.wins[b] || 0) - (S.wins[a] || 0)).map((id) => `<div class="pill">${faceOf(id)} ${esc(nameOf(id))} · ${S.wins[id] || 0}승</div>`).join("")}</div>${isHost ? '<button id="againBtn" class="primary" style="pointer-events:auto">대기실로</button>' : "<p>방장이 다음 판을 정할 거예요</p>"}`);
    if ($("againBtn")) $("againBtn").onclick = () => emit({ t: "lobby" });
  }
  if (S.phase !== "playing") ov.style.background = S.phase === "gameOver" ? "" : "rgba(255,255,255,.55)";
}
setInterval(() => { if (S && S.phase === "countdown") { const n = Math.max(1, Math.ceil((localEnds - Date.now()) / 1000)), e = $("cdNum"); if (e) e.textContent = n; } }, 100);
</script>
</body>
</html>
